.box{background:var(--soft);border-radius:10px;padding:14px;font-size:14px;line-height:1.75}.okbox{background:rgba(231,246,238,.6);border:1px solid rgba(13,122,63,.2)}
.kv{list-style:none;margin:0 0 14px;padding:0}.kv li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.sw{display:flex;gap:8px;align-items:center;font-size:13.5px}.sw input{width:18px;height:18px;accent-color:var(--brand)}
