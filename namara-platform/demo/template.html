<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAMARA デモ</title>
<style>
:root{--navy:#1e3a8a;--navy-d:#172554;--blue:#2563eb;--soft:#eff6ff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--surface:#f8fafc;--paper:#fff;--ad:#b45309;--ad-soft:#fffbeb;--good:#047857;--bad:#b91c1c;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;line-height:1.7;font-size:14px}
button,input,select{font:inherit}
a{color:inherit}
.top{background:var(--navy-d);color:#fff}
.top .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-weight:700;letter-spacing:.04em}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ad{background:var(--ad-soft);color:var(--ad);border:1px solid #fcd34d}
.pill.good{background:#ecfdf5;color:var(--good)}
.pill.bad{background:#fef2f2;color:var(--bad)}
.pill.info{background:var(--soft);color:var(--navy)}
.pill.mute{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#bfdbfe;padding:9px 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:#fff;border-color:#fff;font-weight:700}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.notice{border:1px solid #fde68a;background:var(--ad-soft);color:#78350f;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.notice.info{border-color:#dbeafe;background:var(--soft);color:var(--navy)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h3{margin:0 0 2px;font-size:15px}
.card .desc{margin:0 0 12px;color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px}
.k5{grid-template-columns:repeat(5,minmax(0,1fr))}.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:2fr 1fr}
@media (max-width:900px){.k5,.k6{grid-template-columns:repeat(3,minmax(0,1fr))}.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.c2,.c3{grid-template-columns:1fr}}
@media (max-width:520px){.k5,.k6,.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .s{font-size:12px;color:var(--muted)}
.up{color:var(--good)}.down{color:var(--bad)}
h2.sec{font-size:13px;color:var(--muted);margin:22px 0 10px}
h1.page{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.bars{list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:minmax(80px,120px) 1fr 96px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bars .track{height:10px;background:var(--surface);border-radius:0 4px 4px 0;position:relative}
.bars .fill{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:0 4px 4px 0}
.bars .hatch{position:absolute;inset:0;background:repeating-linear-gradient(45deg,#e2e8f0 0 4px,transparent 4px 8px)}
.bars .num{text-align:right;font-variant-numeric:tabular-nums}
.bars li:hover .fill{background:var(--blue)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.btn.pri:hover{background:var(--navy-d)}
.btn.sm{padding:3px 9px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:6px 8px;background:var(--surface)}
td{border-top:1px solid var(--line);padding:7px 8px;vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
/* chat */
.ai-wrap{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:20px;align-items:start}
.ai-wrap>*,.grid>*{min-width:0}.store,.sponsor,.cond{overflow-wrap:anywhere}
@media (max-width:900px){.ai-wrap{grid-template-columns:1fr}}
.phone{background:linear-gradient(#eff6ff99,#fff);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;height:760px}
.phone-h{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#fffffff0}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.bub{max-width:90%;border-radius:16px;padding:9px 13px}
.bub.bot{background:var(--soft);border-top-left-radius:4px}
.bub.me{background:var(--navy);color:#fff;align-self:flex-end;border-top-right-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid #93c5fd;background:#fff;color:var(--navy);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.cond{background:var(--surface);border-radius:10px;padding:6px 10px;font-size:12px}
.cond b{color:var(--navy)}
.store{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.store .head{display:flex;gap:10px}
.ph{width:76px;aspect-ratio:4/3;flex:none;border-radius:8px;background:var(--soft);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px}
.ph span:first-child{font-size:20px}
.store h4{margin:0;font-size:14px;line-height:1.4}
.meta{color:var(--muted);font-size:12px}
.dl{display:grid;grid-template-columns:60px 1fr;gap:2px 8px;font-size:12px;margin-top:8px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.why{background:var(--soft);border-radius:8px;padding:6px 8px;margin-top:8px}
.why b{font-size:11px;color:var(--navy)}
.why span{display:inline-block;background:#fff;color:var(--navy);border-radius:999px;padding:0 8px;font-size:11px;margin:2px 3px 0 0}
.warn{color:var(--ad);font-size:11px;margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sponsor{background:var(--ad-soft);border:2px solid #fcd34d;border-radius:12px;padding:12px}
.sponsor .lab{background:var(--ad);color:#fff;border-radius:4px;padding:1px 8px;font-size:11px;font-weight:700}
.composer{border-top:1px solid var(--line);padding:10px;background:#fff}
.composer form{display:flex;gap:6px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.composer p{margin:6px 2px 0;font-size:10px;color:var(--muted)}
.log{font-family:ui-monospace,Menlo,monospace;font-size:11px;max-height:300px;overflow:auto;background:#0f172a;color:#cbd5e1;border-radius:10px;padding:10px}
.log div{white-space:nowrap}
.log .t{color:#93c5fd}
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;cursor:pointer}
.subtabs button[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.action{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.action .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:6px}
.action ul{margin:6px 0 0;padding-left:34px;color:var(--muted);font-size:13px}
.action .foot{font-size:12px;color:var(--muted);margin:6px 0 0 28px}
.stars{color:var(--ad)}.stars i{color:var(--line);font-style:normal}
.empty{border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted);background:var(--surface)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}
svg text{font-size:10px;fill:#64748b}
.tip{position:absolute;right:0;top:0;background:var(--ink);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;pointer-events:none}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f input,label.f select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)}
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <div class="row"><span class="brand">NAMARA PLATFORM</span><span class="pill ad">デモ（すべて架空データ）</span></div>
    <span style="font-size:12px;color:#bfdbfe">なまらAI × NAMARA REVIEW ｜ 運営：なまらグルメ</span>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="ai" aria-selected="true">なまらAI（消費者）</button>
    <button role="tab" data-tab="review">NAMARA REVIEW（店舗）</button>
    <button role="tab" data-tab="admin">運営管理</button>
  </nav>
</div>
<main id="app"><div class="notice">デモを読み込んでいます…<br>この表示のまま変わらない場合、表示画面でスクリプト（JavaScript）が止められています。ファイルをダウンロードして、パソコンの Chrome や Edge で開いてください。</div></main>
<noscript><div style="max-width:720px;margin:20px auto;padding:12px 16px;border:1px solid #fde68a;background:#fffbeb;border-radius:10px">このデモは JavaScript を使います。ファイルを保存して、Chrome や Edge などのブラウザで開いてください。</div></noscript>
<script>/*LOGIC*/</script>
<script>/*UI*/</script>
</body>
</html>
